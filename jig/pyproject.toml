[project]
name = "retrieval-failures-jig"
version = "0.1"
description = "Jig for the retrieval-failures experiment set"
requires-python = ">=3.13"
dependencies = [
    # Pinned to the latest harness release at the moment this set was
    # scaffolded. Bump it deliberately: a finding is only reproducible if
    # the apparatus that measured it is identified too, so the version in
    # use gets recorded on the experiment issue.
    "soliplex-lab-harness @ git+https://github.com/soliplex/lab_harness@v0.4",
    # The corpus fixture builds a LanceDB database, which is haiku-rag's
    # job. Pinned to the range soliplex 0.78.1 itself declares: the jig
    # writes a database that a cell's soliplex then reads, and two
    # different haiku-rag majors do not have to agree about its layout.
    "haiku.rag-slim>=0.78.0,<0.79",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]
# Regenerating 'questions.json' runs a model over the corpus. That is a
# deliberate act, not something a run does, so what it needs is not a
# dependency of the jig -- 'questions.load()' is stdlib-only on purpose.
fixtures = [
    "pydantic-ai>=1.0",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "retrieval_failures"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E", "B", "UP", "I", "PD", "TRY", "PT"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.logfire]
# The fixture builders import haiku-rag, which is instrumented. Nothing
# here is a measured turn -- the harness configures logfire for those --
# so the "not configured" warning is noise on every ingest.
ignore_no_config = true
