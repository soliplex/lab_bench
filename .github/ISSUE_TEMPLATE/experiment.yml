name: Experiment
description: Record and track one measurement experiment
title: "[exp] "
labels: ["status:proposed", "proposal:exp"]
body:
  - type: markdown
    attributes:
      value: |
        One issue per experiment. **Start in a discussion** -- this form
        is the second stage, for a design that has settled.

        **Acceptance is adding `status:accepted`.** A workflow then renders
        these fields into `EXPERIMENT.md` and creates `exp/<set>/<slug>`
        already holding it. **That branch cannot be deleted afterwards** --
        the ruleset forbids it -- so the branch name is worth getting
        right.

        **From then on, `EXPERIMENT.md` is the record.** Findings are
        appended there as runs complete, dated -- not to this issue. What
        you write below is written before the run and committed to a branch
        that cannot be force-pushed, which is what makes it
        pre-registration rather than a claim about one.

        Acceptance applies the `exp:<set>` label, so this issue shows up
        in that set's listing. It will not auto-close: an experiment branch
        never merges, so close it by hand when the findings are recorded.
  - type: input
    id: set-branch
    attributes:
      label: Experiment set branch
      description: The `set/<name>` branch this experiment starts from.
      placeholder: set/soliplex-room-behavior
    validations:
      required: true
  - type: input
    id: exp-branch
    attributes:
      label: Experiment branch
      description: The `exp/<set>/<slug>` branch holding this experiment.
      placeholder: exp/soliplex-room-behavior/1319-tool-naming
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: >
        What is being claimed, in a form that a measurement could contradict.
    validations:
      required: true
  - type: textarea
    id: axes
    attributes:
      label: Axes and cells
      description: >
        Each axis, its kind (code / configuration / task), its values, and
        the resulting cell list.
      placeholder: |
        code axis (2 refs): v0.77.2, v0.78.1
        model axis (2): gemma4-26b, <other>
        -> 4 cells
    validations:
      required: true
  - type: input
    id: trials
    attributes:
      label: N per cell
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: Refs under test
      description: >
        For each code-axis value, the exact ref (tag or commit sha). Omit if
        there is no code axis.
  - type: textarea
    id: models
    attributes:
      label: Model endpoints and ids
      description: >
        Base URL and the exact model id as served, per model-axis value.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task prompt (verbatim)
      description: Copy it exactly. Paraphrase makes the run unreproducible.
      render: text
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Fixture
      description: >
        Generator path, seed, and the expected value the scorer checks for.
      placeholder: |
        gen: fixtures/orders.py  seed: 1319  rows: 60
        expected Southeast total: 40935.89
    validations:
      required: true
  - type: input
    id: jig
    attributes:
      label: Jig / harness version
      description: Commit sha on the set branch, plus any pinned harness version.
    validations:
      required: true
  - type: dropdown
    id: publishability
    attributes:
      label: Publishability
      description: >
        This repository is PUBLIC. Confirm nothing customer-derived is
        involved. If any arm needs private material, that arm does not belong
        here.
      options:
        - "Public: no customer-derived material in any arm"
        - "Mixed: some arms excluded from this bench (say which below)"
    validations:
      required: true
  - type: textarea
    id: preconditions
    attributes:
      label: Preconditions
      description: >
        The state to print and confirm *before* spending trials -- resolved
        flags, the tool names actually registered, which capabilities are
        deferred. A cell that structurally cannot exhibit the behavior
        under test yields a null that reads as a result; that has already
        cost this bench twice.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: >
        Arms deliberately excluded, known rig artifacts, the discussion
        this came from.
